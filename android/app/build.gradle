apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/**
 * Release signing: YOUR private upload key — never the public React Native
 * debug key (Google Play rejects debug-signed apps, and anyone holding that
 * well-known key could sign an "update" of this app).
 *
 * Create it once on your computer with `npm run keystore`. That writes
 * android/app/upload.keystore + android/keystore.properties (both git-ignored).
 * BACK BOTH UP (password manager / secure drive): every future update must be
 * signed with the same key.
 *
 * CI / another computer can give the same four values as environment
 * variables or Gradle properties (-P) instead of keystore.properties:
 *   SW_UPLOAD_STORE_FILE      path to the keystore (relative to android/, or absolute)
 *   SW_UPLOAD_STORE_PASSWORD
 *   SW_UPLOAD_KEY_ALIAS
 *   SW_UPLOAD_KEY_PASSWORD
 *
 * Only to update phones that still have the OLD debug-signed app installed
 * (never upload this to a store): ./gradlew assembleRelease -PdebugSignedRelease=true
 */
def uploadProps = new Properties()
def uploadPropsFile = rootProject.file("keystore.properties")
if (uploadPropsFile.exists()) {
    uploadPropsFile.withInputStream { uploadProps.load(it) }
}
def uploadValue = { String name ->
    def v = project.findProperty(name) ?: System.getenv(name) ?: uploadProps.getProperty(name)
    return v ? v.toString().trim() : null
}
def uploadStorePath = uploadValue("SW_UPLOAD_STORE_FILE")
def uploadStoreFile = uploadStorePath ? rootProject.file(uploadStorePath) : null
def uploadStorePassword = uploadValue("SW_UPLOAD_STORE_PASSWORD")
def uploadKeyAlias = uploadValue("SW_UPLOAD_KEY_ALIAS")
def uploadKeyPassword = uploadValue("SW_UPLOAD_KEY_PASSWORD") ?: uploadStorePassword
def uploadKeyReady = uploadStoreFile != null && uploadStoreFile.exists() && uploadStorePassword && uploadKeyAlias
def debugSignedRelease = (project.findProperty("debugSignedRelease") ?: "false").toString() == "true"

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    // namespace = package of the Kotlin sources (MainActivity/MainApplication).
    namespace "com.shelfwatchplus"
    defaultConfig {
        // Must stay the OLD app's ID so this installs as an update over it.
        applicationId "com.shelfwatchstudent"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Old app was versionCode 1 — an update must be >= that.
        versionCode 2
        versionName "2.0"
    }
    // react-native-pdf (FileViewer) bundles its own libc++_shared.so; keep one copy per ABI
    packaging {
        jniLibs {
            pickFirsts += [
                'lib/x86/libc++_shared.so',
                'lib/x86_64/libc++_shared.so',
                'lib/armeabi-v7a/libc++_shared.so',
                'lib/arm64-v8a/libc++_shared.so'
            ]
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (uploadKeyReady) {
            release {
                storeFile uploadStoreFile
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            // debug builds (and debugOptimized, which copies debug) keep the debug key
            signingConfig signingConfigs.debug
        }
        release {
            // Your upload key (see above). Releases signed with the public debug key
            // only on explicit request (-PdebugSignedRelease=true), never by default.
            if (uploadKeyReady) {
                signingConfig signingConfigs.release
            } else if (debugSignedRelease) {
                signingConfig signingConfigs.debug
            }
            // neither: the check below stops the build with instructions
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

// A release build without the upload key stops here with instructions,
// instead of producing an unsigned (uninstallable) or debug-signed APK/AAB.
if (!uploadKeyReady && !debugSignedRelease) {
    def missing = uploadStorePath && !(uploadStoreFile?.exists()) ?
        "the keystore file ${uploadStoreFile} does not exist" :
        "no upload key is configured (android/keystore.properties or SW_UPLOAD_* variables)"
    def help = "Release builds are signed with your own upload key, but ${missing}.\n" +
        "Create one once with:  npm run keystore   (then back up android/app/upload.keystore\n" +
        "and android/keystore.properties somewhere safe). See the top of android/app/build.gradle."
    // preReleaseBuild runs first for every release build; the package/sign tasks are a backstop
    // in case a future Android Gradle Plugin renames it.
    def releaseGuards = ["preReleaseBuild", "packageRelease", "packageReleaseBundle", "signReleaseBundle"]
    tasks.matching { it.name in releaseGuards }.configureEach {
        doFirst { throw new GradleException(help) }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// Firebase push: turns android/app/google-services.json into resources. Keep last.
apply plugin: "com.google.gms.google-services"
